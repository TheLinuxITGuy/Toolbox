[package]
name = "linux-it-guy-toolbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A modern Rust desktop toolbox for Linux app installs and admin tasks."
license = "MIT"

[dependencies]
csv = "1.3"
eframe = { version = "0.34.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
resvg = { version = "0.45", default-features = false }
serde = { version = "1.0", features = ["derive"] }
tiny-skia = "0.11"
usvg = { version = "0.45", default-features = false }
